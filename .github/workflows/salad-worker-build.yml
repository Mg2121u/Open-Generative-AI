name: Publish Salad image worker
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "gpu-worker/**"
      - ".github/workflows/salad-worker-build.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Version label (e.g. pilot-1)"
        required: true
        default: "pilot-1"
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/aria-nicole-creator-studio')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./gpu-worker
          file: ./gpu-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mg2121u/aria-nicole-gpu-worker:pilot-${{ github.sha }}
