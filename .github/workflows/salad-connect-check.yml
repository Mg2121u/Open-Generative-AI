name: Verify SaladCloud Organization (read-only)
# DISABLED BY DEFAULT: this REST credential is currently rejected (401).
# Portal-based deployment is supported; do not automatically repeat failed key checks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  salad-readonly-auth:
    name: Verify organization mgg1981 and project
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SALAD_API_KEY: ${{ secrets.SALAD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify authenticated read-only Salad API access
        run: python3 gpu-worker/salad_preflight.py
