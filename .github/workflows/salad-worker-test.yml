name: Test Salad worker API
on:
  pull_request:
    paths:
      - "gpu-worker/**"
      - ".github/workflows/salad-worker-test.yml"
  push:
    branches: ["feature/aria-nicole-creator-studio"]
    paths: ["gpu-worker/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "fastapi==0.115.8" "uvicorn==0.34.0" "httpx==0.28.1" "Pillow==11.1.0" "pytest==8.3.4" "boto3==1.36.16"
      - run: python -m compileall -q gpu-worker/app.py
      - run: cd gpu-worker && python -m pytest -q tests
