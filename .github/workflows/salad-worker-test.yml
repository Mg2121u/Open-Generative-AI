name: Test Salad worker API
on:
  pull_request:
    paths:
      - "gpu-worker/**"
      - ".github/workflows/salad-worker-test.yml"
  push:
    branches: ["feature/aria-nicole-creator-studio"]
    paths: ["gpu-worker/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "fastapi==0.115.8" "uvicorn==0.34.0" "httpx==0.28.1" "Pillow==11.1.0" "pytest==8.3.4" "boto3==1.36.16"
      - run: python -m compileall -q gpu-worker/app.py
      - run: cd gpu-worker && python -m pytest -q tests
      - name: Smoke-test real HTTP listener and health paths (CPU/mock, no Salad cost)
        run: |
          cd gpu-worker
          ENVIRONMENT=test MOCK_INFERENCE=1 STORAGE_DRIVER=ephemeral MAX_REPLICAS=1 WORKER_API_TOKEN=test-only-0123456789abcdefghijklmnopqrstuvwxyz uvicorn app:app --host :: --port 8000 > /tmp/salad-worker-smoke.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz | grep -q alive; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/salad-worker-smoke.log
            exit 1
          fi
          curl --fail --silent --noproxy '*' -6 -g 'http://[::1]:8000/healthz' | grep -q alive
          curl --fail --silent --noproxy '*' -6 -g 'http://[::1]:8000/readyz' | grep -q ready
          curl --fail --silent --noproxy '*' -4 'http://127.0.0.1:8000/readyz' | grep -q ready
